# kube-prometheus-stack 93.3.0, trimmed for one 4 GB server.
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack --version 93.3.0 \
#     -n monitoring --create-namespace -f deploy/server/monitoring-values.yaml
#
# Grafana is off (0 pods) to save ~400 MB. To look at dashboards, add  --set grafana.replicas=1
# to the command above; run it again without that when you're done.
#
# Alerts show in Prometheus (and in Grafana when it's on). Nothing sends them anywhere yet:
# Alertmanager is off to save memory, so the outside uptime check is what pages you.
alertmanager:
  enabled: false

# The stock rule set is large; keep the node and Kubernetes basics only.
defaultRules:
  create: true
  rules:
    etcd: false
    kubeProxy: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
    # Built on the API server's latency histograms, which aren't scraped (below).
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false

# k3s runs these inside one process; their separate scrape targets would only show "down".
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

# Measured 20 Nov 2026: of 124k series in memory, 107k were Kubernetes timing itself, and
# half of those twice. k3s runs the whole control plane in one process, so the kubelet's
# /metrics page carries the API server's, etcd's and the scheduler's metrics too, and the
# separate API server scrape collected the same again. Nothing here uses them.
kubeApiServer: { enabled: false }
kubelet:
  serviceMonitor:
    # Applies to the kubelet's /metrics only (container stats come from /metrics/cadvisor).
    metricRelabelings:
      # The chart's default, kept: fewer buckets for storage operation timings.
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # The control plane's metrics, which k3s adds to the kubelet's page. kubelet_*, rest_client_*,
      # process_*, go_* and volume_* stay: the kubelet rules and dashboards use them.
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd|workqueue|scheduler|kine|lasso|apiextensions|aggregator|authentication|authenticated|authorization|watch|kubeproxy|field_validation|endpoint_slice|node_collector|node_ipam|replicaset|job_controller|cronjob_controller|service_controller|ttl_after_finished|garbagecollector|root_ca|clustertrustbundle|serviceaccount|taint_eviction|ephemeral_volume|pv_collector|dra|cloud_provider|horizontal_pod|daemon_controller|statefulset|force_cleaned|retroactive|disabled_metrics|hidden_metrics|registered_metrics|cardinality_enforcement|kubernetes_feature|grpc|k3s)_.*

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 3GB
    resources:
      requests: { cpu: 50m, memory: 300Mi }
      limits: { memory: 700Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # Pick up ServiceMonitors and rules from every namespace (the app's live in onehintaway).
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  # Off by default: its disk, login, address and certificate stay, only the pod is gone.
  replicas: 0
  # The login is in a Secret created on the server, not in this file.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 300Mi }
  persistence:
    enabled: true
    size: 1Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts: [grafana.onehintaway.com]
    tls:
      - hosts: [grafana.onehintaway.com]
        secretName: grafana-tls

prometheusOperator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 200Mi }

additionalPrometheusRulesMap:
  onehintaway:
    groups:
      - name: onehintaway
        rules:
          - alert: ApiDown
            expr: sum(up{namespace="onehintaway", service="api"}) < 1 or absent(up{namespace="onehintaway", service="api"})
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: No API pod is answering Prometheus.
          - alert: DiskFillingUp
            expr: (node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}) < 0.15
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: Less than 15% of the server's disk is free.
