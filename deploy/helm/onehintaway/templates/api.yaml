# Settings that are not secret. A change here rolls the API (see the checksum below).
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels: {{- include "ohw.labels" . | nindent 4 }}
data:
  DB_URL: jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  CORS_ORIGINS: {{ .Values.api.corsOrigins | quote }}
  PUBLIC_URL: {{ .Values.api.publicUrl | quote }}
  SITE_URL: {{ .Values.api.siteUrl | quote }}
  MAIL_FROM: {{ .Values.api.mailFrom | quote }}
  # Behind Traefik: take the reader's address from X-Forwarded-For.
  FORWARD_HEADERS: native
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    {{- include "ohw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  # Keep 5 old versions so `helm rollback` / `kubectl rollout undo` have somewhere to go.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0           # never fewer than the wanted number of ready pods
      maxSurge: 1                 # one extra pod at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
      annotations:
        checksum/config: {{ .Values.api | toJson | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        {{- include "ohw.waitForPostgres" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
            - name: VISITOR_SALT
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: VISITOR_SALT } }
            - name: ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: ADMIN_TOKEN } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: RESEND_API_KEY, optional: true } }
          # startup: give the JVM up to 150 s to boot before the other two probes count.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          # liveness: failing = restart the container.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # readiness: failing = take the pod out of the Service, don't restart it.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Let in-flight requests finish before the pod goes away.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    {{- include "ohw.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
