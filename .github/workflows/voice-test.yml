# Voice test: says the same six lines with Kokoro (today's voice) and with Chatterbox (MIT licence), five takes
# per line, each checked by Whisper, so the voices and the automatic check can be compared by ear. Manual only: Actions tab > Voice test > Run workflow.
# Nothing here touches the videos. The WAV files and a timing note appear on the run's page under "Artifacts".
name: Voice test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Kokoro af_heart: the baseline, said exactly as the video engine says it, plus a 12-second reference clip
  # of the same voice for Chatterbox to copy (af_heart is Kokoro's own voice, Apache 2.0).
  kokoro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: youtube/engine/requirements.txt

      - name: Python packages
        run: pip install -q -r youtube/engine/requirements.txt

      - name: Voice model (cached)
        uses: actions/cache@v6
        with:
          path: youtube/engine/models
          key: kokoro-model-files-v1.0

      - name: Download the voice model if not cached
        run: |
          mkdir -p youtube/engine/models && cd youtube/engine/models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f "$f" ] || curl -sSfLO "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done

      - name: Say the lines
        run: |
          mkdir -p out ref
          python - <<'EOF'
          import json, sys, time
          import numpy as np, soundfile as sf
          sys.path.insert(0, "youtube/engine")
          import engine as E

          lines = [
              "Five numbers. Which two add up to ten?",
              "Is four on the list?",
              "Four is on it. One look. That list is a hash map.",
              "Then three asks for its partner, which is three. It finds itself. Wrong!",
              'In banana, "a" comes three times, "n" comes twice, and "b" comes once.',
              "Remember: ask the map first, then store the number.",
          ]
          kokoro_lines = list(lines)   # the engine's letter marks, as in the post 05 script
          kokoro_lines[4] = "In banana, [a](/ˈeɪ/) comes three times, [n](/ˈɛn/) comes twice, and [b](/bˈiː/) comes once."
          json.dump(lines, open("ref/lines.json", "w"), ensure_ascii=False, indent=1)

          ref, _ = E.human("Here is the idea in one line. We keep a small notebook of the numbers we have already seen. "
                           "For each new number, we check the notebook first. That one habit turns a slow search into a fast one.")
          sf.write("ref/reference.wav", ref, E.SR)

          gap = np.zeros(int(0.8 * E.SR), np.float32); parts = []; t0 = time.time()
          for i, text in enumerate(kokoro_lines, 1):
              a, _ = E.human(text)
              sf.write(f"out/kokoro-{i:02d}.wav", a, E.SR); parts += [a, gap]
          audio = np.concatenate(parts)
          sf.write("out/kokoro-all-lines.wav", audio, E.SR)
          took = time.time() - t0; secs = len(audio) / E.SR
          open("out/timing-kokoro.txt", "w").write(f"kokoro af_heart: {secs:.1f} s of speech in {took:.1f} s ({took / secs:.2f}x real time)\n")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: reference
          retention-days: 1
          path: ref/

      - uses: actions/upload-artifact@v7
        with:
          name: part-kokoro
          retention-days: 1
          path: out/

  # Chatterbox (MIT), the main 0.5B model copying af_heart at exaggeration 0.5 / cfg 0.5 - the pick from the first test.
  # Every line is said with 5 different seeds ("takes"), and each take is heard back by Whisper (MIT), which writes
  # down what it hears and how sure it is of every word. Comparing that with your ears shows whether a bad take
  # (like the rough "Is" in "Is four on the list?") can be caught and redone automatically.
  chatterbox:
    needs: kokoro
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages (processor-only PyTorch, Chatterbox pinned to one commit, Whisper)
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@ab55923c27757c90cfcc407baa57dc25a7d25217" faster-whisper==1.2.1

      - name: Model files (cached)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: chatterbox-original-whisper-base-ab55923

      - uses: actions/download-artifact@v8
        with:
          name: reference
          path: ref

      - name: Say every line five times and hear each take back
        run: |
          mkdir -p out
          python - <<'EOF'
          import json, re, time
          import torch, torchaudio as ta
          from chatterbox.tts import ChatterboxTTS
          from faster_whisper import WhisperModel

          lines = json.load(open("ref/lines.json"))
          model = ChatterboxTTS.from_pretrained(device="cpu")
          ear = WhisperModel("base.en", device="cpu", compute_type="int8")
          NUM = {"4": "four", "3": "three", "10": "ten", "5": "five", "2": "two", "1": "one"}
          def norm(t):
              return [NUM.get(w, w) for w in re.findall(r"[a-z0-9]+", t.lower())]

          report, spoken, t0 = [], 0.0, time.time()
          for i, text in enumerate(lines, 1):
              for seed in range(1, 6):
                  torch.manual_seed(seed)
                  wav = model.generate(text, audio_prompt_path="ref/reference.wav", exaggeration=0.5, cfg_weight=0.5)
                  name = f"out/line{i:02d}-take{seed}.wav"
                  ta.save(name, wav, model.sr); spoken += wav.shape[1] / model.sr
                  # hand Whisper the audio itself at 16 kHz (its own file reader clashes with the PyAV version Chatterbox installs)
                  pcm = ta.functional.resample(wav, model.sr, 16000)[0].numpy().astype("float32")
                  segs, _ = ear.transcribe(pcm, language="en", word_timestamps=True, beam_size=5)
                  ws = [w for s in segs for w in s.words]
                  heard = " ".join(w.word.strip() for w in ws)
                  low = min(ws, key=lambda w: w.probability) if ws else None
                  report.append(f"line {i} take {seed}: {'MATCH' if norm(heard) == norm(text) else 'DIFFERENT'} | "
                                f"first word {ws[0].word.strip()!r} {ws[0].probability:.2f} | " if ws else f"line {i} take {seed}: heard nothing | ")
                  if ws:
                      report[-1] += f"least sure {low.word.strip()!r} {low.probability:.2f} | heard: {heard}"
                  print(report[-1], flush=True)
              report.append("")
          took = time.time() - t0
          report.append(f"{spoken:.1f} s of speech made and checked in {took:.1f} s ({took / spoken:.2f}x real time)")
          open("out/report.txt", "w").write("\n".join(report) + "\n")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: part-chatterbox
          retention-days: 1
          if-no-files-found: warn
          path: out/

  collect:
    needs: [kokoro, chatterbox]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Put every voice in one download
        uses: actions/upload-artifact/merge@v7
        with:
          name: voice-test-${{ github.run_number }}
          pattern: part-*
          retention-days: 3
          delete-merged: true
