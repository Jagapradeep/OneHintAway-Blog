# The k3s server. CI adds:  --set api.image.tag=<git SHA>
api:
  image:
    repository: ghcr.io/jagapradeep/onehintaway-api
  host: api.onehintaway.com
  corsOrigins: https://onehintaway.com
  publicUrl: https://api.onehintaway.com
  siteUrl: https://onehintaway.com
  # One pod on a 4 GB server (saves ~300 MB). Deploys still have no gap: maxSurge 1 and
  # maxUnavailable 0 start the new pod and wait for it to be ready before the old one stops,
  # and the old one pauses 5 s (preStop in templates/api.yaml) until Traefik stops using it.
  # The cost: if this pod crashes, the API is down until Kubernetes restarts it (~30-60 s).
  # Your laptop's k3d cluster keeps the default of 2.
  replicas: 1
umami:
  host: stats.onehintaway.com
ingress:
  tls:
    enabled: true
    clusterIssuer: letsencrypt
backup:
  enabled: true
metrics:
  serviceMonitor: true
