name: API

# test -> build the image -> push it to GHCR -> roll it out on the cluster.
# Pull requests stop after the tests; only a push to main deploys.
on:
  push:
    branches: [main]
    paths: ["api/**", "deploy/helm/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "deploy/helm/**", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jagapradeep/onehintaway-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The runner already has Docker, which is all Testcontainers needs.
      # chmod: a checkout made from Windows can lose the script's executable bit.
      - run: chmod +x mvnw && ./mvnw --batch-mode --no-transfer-progress verify

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag is the commit: every image can be traced to its code, and a rollback
      # is just an older tag. Layers are cached between runs.
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time; a newer push waits instead of overtaking.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.2
      # KUBE_CONFIG is an account that can change the onehintaway namespace only.
      - name: Write kubeconfig
        run: |
          printf '%s' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      # --rollback-on-failure: if the new pods don't become ready in time, Helm puts the
      # previous version back and this job fails. Readers never see the broken one,
      # because old pods are only removed after new ones are ready.
      - name: Roll out
        run: |
          helm upgrade --install onehintaway deploy/helm/onehintaway \
            --kubeconfig "$RUNNER_TEMP/kubeconfig" --namespace onehintaway \
            -f deploy/helm/onehintaway/values-production.yaml \
            --set api.image.tag=${{ github.sha }} \
            --wait --timeout 6m --rollback-on-failure
      - name: Check the public address
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://api.onehintaway.com/actuator/health/readiness
      - name: History
        if: always()
        run: helm history onehintaway --kubeconfig "$RUNNER_TEMP/kubeconfig" --namespace onehintaway --max 5
