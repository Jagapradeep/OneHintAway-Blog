name: API

# Runs the API's tests (unit + Testcontainers against PostgreSQL 16) whenever the API changes.
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The runner already has Docker, which is all Testcontainers needs.
      # chmod: a checkout made from Windows can lose the script's executable bit.
      - run: chmod +x mvnw && ./mvnw --batch-mode --no-transfer-progress verify
