spring.application.name=api

# Local values come from api/.env (git-ignored; see .env.example). In production they are
# real environment variables, which win over this file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:onehintaway}}
spring.datasource.username=${POSTGRES_USER:onehintaway}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors as RFC 9457 problem JSON.
spring.mvc.problemdetails.enabled=true

# Behind a proxy (Traefik on the cluster) set FORWARD_HEADERS=native, or every reader
# shares the proxy's address and counts as one visitor.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

app.cors-origins=${CORS_ORIGINS:http://localhost:3000}
app.visitor-salt=${VISITOR_SALT:}
app.admin-token=${ADMIN_TOKEN:}
app.public-url=${PUBLIC_URL:http://localhost:8080}
# Where a reader lands after opening a confirmation link (pages /subscribed/ on the site).
app.site-url=${SITE_URL:http://localhost:3000}
# Blank key = confirmation links are written to the log instead of emailed.
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:One Hint Away <hello@onehintaway.com>}
app.rate.count-per-minute=60
app.rate.subscribe-per-hour=5
app.rate.admin-per-minute=10
# Sign-in codes: per caller address (in memory, per replica) and per email (counted in Postgres).
app.rate.link-per-hour=${LINK_PER_HOUR:10}
app.rate.link-per-email-per-hour=${LINK_PER_EMAIL_PER_HOUR:3}

# The session cookie is HTTPS-only. false is for plain-http local runs in a browser that
# refuses Secure cookies from http://localhost (Safari); never in production.
app.auth.cookie-secure=${SESSION_COOKIE_SECURE:true}
